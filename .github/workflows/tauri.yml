name: Build & Release

# Builds the macOS and Linux bundles plus a source tarball.
# - Push a tag `vX.Y.Z` to create a GitHub Release with the artifacts.
# - Or run manually from the Actions tab (workflow_dispatch) to test a build.
#
# The repo root IS the Tauri project (package.json + src-tauri live here).
# Windows is intentionally not built here.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            no_strip: "1"
          - platform: macos-latest
            bundles: app,dmg
            no_strip: "0"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Don't persist the token in .git/config (supply-chain hardening).
          persist-credentials: false

      # Cache is disabled on tag (release) runs to avoid the cache-poisoning
      # vector.
      - name: Setup Node
        # actions/setup-node@v4
        # zizmor: ignore[cache-poisoning] — false positive (zizmor#1485):
        # the rule doesn't recognize the explicit cache: '' opt-out on tags.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          # Cache only on manual (non-release) runs; tag pushes publish
          # artifacts, so caching is off to avoid cache poisoning.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rust stable
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev dpkg

      - name: Build Tauri app
        # tauri-apps/tauri-action@v0
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux: skip strip — some system libs use RELR ELF sections that
          # linuxdeploy's bundled strip can't parse (aborts AppImage bundling).
          NO_STRIP: ${{ matrix.no_strip }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          args: --bundles ${{ matrix.bundles }}

      - name: Package source tarball
        run: bash scripts/package-source.sh

      - name: Upload source tarball (workflow artifact)
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source
          path: dist/audio-vault-*.tar.gz

      - name: Attach source tarball to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Use the runner's built-in `gh` CLI (no third-party action).
        run: |
          FILES="dist/audio-vault-*.tar.gz"
          gh release upload "${GITHUB_REF_NAME}" "$FILES" --clobber
