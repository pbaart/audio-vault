name: Build & Release

# Builds the macOS and Linux bundles plus a source tarball.
# - Push a tag `vX.Y.Z` to create a GitHub Release with the artifacts.
# - Or run manually from the Actions tab (workflow_dispatch) to test a build.
#
# The repo root IS the Tauri project (package.json + src-tauri live here).
# Windows is intentionally not built here.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            no_strip: "1"
          - platform: macos-latest
            bundles: app,dmg
            no_strip: "0"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev dpkg

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux: skip strip — some system libs use RELR ELF sections that
          # linuxdeploy's bundled strip can't parse (aborts AppImage bundling).
          NO_STRIP: ${{ matrix.no_strip }}
        with:
          tagName: v__VERSION__
          args: --bundles ${{ matrix.bundles }}

      - name: Package source tarball
        run: bash scripts/package-source.sh

      - name: Upload source tarball (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/audio-vault-*.tar.gz

      - name: Attach source tarball to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/audio-vault-*.tar.gz
