<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Vault</title>
    <script>
      // Apply the saved theme before first paint (localStorage mirror kept by
      // src/lib/themes.ts; the Rust config remains the source of truth).
      try {
        var t = localStorage.getItem("audio-vault.theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
