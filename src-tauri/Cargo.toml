[package]
name = "audio-vault"
version = "0.6.0"
description = "Audio Vault — local-first collection manager for audio gear"
authors = ["pbaart"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audio_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
image = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
regex = "1"
# 0.32.x pairs with libsqlite3-sys 0.30 — the same major as sqlx (via
# tauri-plugin-sql), which the `links = "sqlite3"` constraint requires.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
zip = { version = "2", features = ["deflate"] }
